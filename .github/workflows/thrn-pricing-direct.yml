name: Restore THRN constellation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !startsWith(github.event.head_commit.message, 'THRN constellation:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore constellation animation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/content/thrn.html')
          text = path.read_text(encoding='utf-8')
          marker = '// ── THRN constellation network ──'

          if marker not in text:
              js = r'''

// ── THRN constellation network ──
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hero = document.querySelector('.hero');
  if (hero && !reduce) {
    const cv = document.createElement('canvas');
    cv.id = 'thrn-net';
    cv.setAttribute('aria-hidden', 'true');
    hero.insertBefore(cv, hero.firstChild);
    const ctx = cv.getContext('2d');
    let w = 0, h = 0, dpr = 1, nodes = [], raf = 0, visible = true;
    let ptrX = 0, ptrY = 0, tgtX = 0, tgtY = 0, strength = 0, tgtStrength = 0;
    let lastMove = 0, hasPointer = false, lastT = 0;
    const R = 170, R2 = R * R;
    const isTouch = window.matchMedia('(hover: none)').matches ||
      (navigator.maxTouchPoints || 0) > 0;
    const ease = (k, dt) => 1 - Math.pow(1 - k, dt);

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = hero.clientWidth; h = hero.clientHeight;
      cv.width = Math.max(1, w * dpr); cv.height = Math.max(1, h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cap = isTouch ? 40 : 64;
      const count = Math.max(16, Math.min(cap, Math.round(w * h / (isTouch ? 22000 : 18000))));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
        r: 0.8 + Math.random() * 1.1, p: Math.random() * Math.PI * 2,
        ox: 0, oy: 0, a: Math.random() * Math.PI * 2, s: 0.4 + Math.random() * 0.6
      }));
      if (!hasPointer) { ptrX = tgtX = w * 0.5; ptrY = tgtY = h * 0.45; }
    }

    hero.addEventListener('pointermove', (ev) => {
      if (ev.pointerType === 'touch') return;
      const rect = hero.getBoundingClientRect();
      tgtX = ev.clientX - rect.left; tgtY = ev.clientY - rect.top;
      hasPointer = true; tgtStrength = 1; lastMove = performance.now();
    }, { passive: true });
    hero.addEventListener('pointerleave', () => { tgtStrength = 0; }, { passive: true });

    function frame(t) {
      raf = requestAnimationFrame(frame);
      if (!visible) { lastT = t; return; }
      const dt = lastT ? Math.min(3, Math.max(0.2, (t - lastT) / 16.6667)) : 1;
      lastT = t;
      if (hasPointer && t - lastMove > 900) tgtStrength = 0;
      strength += (tgtStrength - strength) * ease(0.03, dt);
      ptrX += (tgtX - ptrX) * ease(0.08, dt);
      ptrY += (tgtY - ptrY) * ease(0.08, dt);
      const ambient = 1 - strength;
      const ambAmp = isTouch ? 3 : 5;
      const ambSpeed = isTouch ? 0.0028 : 0.004;

      ctx.clearRect(0, 0, w, h);
      for (const n of nodes) {
        n.x += n.vx * dt; n.y += n.vy * dt;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
        let dox = 0, doy = 0;
        n.near = 0;
        if (strength > 0.01) {
          const dx = ptrX - n.x, dy = ptrY - n.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < R2) {
            const f = (1 - Math.sqrt(d2) / R);
            n.near = f * strength;
            dox = dx * f * 0.16 * strength;
            doy = dy * f * 0.16 * strength;
          }
        }
        if (ambient > 0.01) {
          n.a += ambSpeed * n.s * dt;
          dox += Math.cos(n.a) * ambAmp * n.s * ambient;
          doy += Math.sin(n.a * 1.3) * ambAmp * n.s * ambient;
        }
        n.ox += (dox - n.ox) * ease(0.045, dt);
        n.oy += (doy - n.oy) * ease(0.045, dt);
        n.px = n.x + n.ox; n.py = n.y + n.oy;
      }
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.px - b.px, dy = a.py - b.py;
          const d2 = dx * dx + dy * dy;
          if (d2 < 26000) {
            const boost = 1 + (a.near + b.near) * 0.9;
            const alpha = Math.min(0.5, (1 - d2 / 26000) * 0.22 * boost);
            ctx.strokeStyle = 'rgba(124,158,122,' + alpha.toFixed(3) + ')';
            ctx.lineWidth = 0.6;
            ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
          }
        }
      }
      for (const n of nodes) {
        const pulse = 0.5 + 0.5 * Math.sin(t / 1400 + n.p);
        const alpha = Math.min(0.85, 0.22 + pulse * 0.34 + n.near * 0.3);
        ctx.fillStyle = 'rgba(168,196,166,' + alpha.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(n.px, n.py, n.r * (1 + n.near * 0.5), 0, Math.PI * 2); ctx.fill();
      }
    }

    resize();
    raf = requestAnimationFrame(frame);
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((e) => { visible = e[0].isIntersecting && !document.hidden; }).observe(hero);
    }
  }
})();
'''
              marker_end = '\n</script>\n</body>'
              if marker_end not in text:
                  raise SystemExit('Could not find document script boundary')
              text = text.replace(marker_end, js + marker_end, 1)
              path.write_text(text, encoding='utf-8')
          else:
              print('Constellation already present.')

      - name: Commit restored constellation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed."
          else
            git add src/content/thrn.html
            git commit -m "THRN constellation: restore hero network"
            git push
          fi
