name: THRN pricing currency patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-pricing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pricing section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/content/thrn.html')
          html = path.read_text(encoding='utf-8')

          if 'id="pricing"' not in html:
              styles = r'''
<style data-thrn-pricing>
.pricing-band{background:var(--base);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:100px 40px}
.pricing-inner{max-width:1120px;margin:0 auto}
.pricing-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:48px}
.pricing-kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-bottom:15px}
.pricing-kicker:before{content:'';width:20px;height:1px;background:var(--gold)}
.pricing-title{font-family:var(--serif);font-size:clamp(40px,5vw,62px);font-weight:400;line-height:1.04;letter-spacing:-.025em;color:var(--text);margin:0 0 12px}
.pricing-title em{color:var(--gold-text);font-style:italic}
.pricing-subtitle{font-size:15px;color:var(--text-2);line-height:1.7;font-weight:300;max-width:620px}
.currency-toggle{display:inline-flex;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--surface);flex-shrink:0}
.currency-toggle button{border:0;background:transparent;color:var(--text-2);font:600 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.06em;padding:8px 14px;border-radius:999px;cursor:pointer}
.currency-toggle button.active{background:var(--text);color:var(--base)}
.pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pricing-card{position:relative;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:30px 28px 28px;min-height:390px;display:flex;flex-direction:column}
.pricing-card.featured{border-color:var(--gold-border);box-shadow:0 0 0 1px var(--gold-dim) inset}
.pricing-badge{position:absolute;top:18px;right:18px;border:1px solid var(--gold-border);background:var(--gold-dim);color:var(--gold-text);border-radius:999px;padding:6px 9px;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.pricing-name{font-family:var(--serif);font-size:25px;color:var(--text);margin-bottom:7px}
.pricing-description{font-size:13px;color:var(--text-2);line-height:1.55;min-height:42px}
.pricing-price{margin:24px 0 22px;display:flex;align-items:baseline;gap:4px}
.pricing-price strong{font-family:var(--serif);font-size:46px;font-weight:400;line-height:1;color:var(--text)}
.pricing-price span{font-size:12px;color:var(--text-3)}
.pricing-features{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.pricing-features li{font-size:12.5px;color:var(--text-2);line-height:1.45;padding-left:18px;position:relative}
.pricing-features li:before{content:'✓';position:absolute;left:0;color:var(--gold-text)}
.pricing-note{margin-top:auto;padding-top:24px;font-size:11px;color:var(--text-3)}
@media(max-width:800px){.pricing-band{padding:80px 20px}.pricing-head{align-items:flex-start;flex-direction:column}.pricing-grid{grid-template-columns:1fr}.pricing-card{min-height:0}.currency-toggle{align-self:flex-start}}
</style>
'''

              section = r'''
<section class="pricing-band" id="pricing">
  <div class="pricing-inner">
    <div class="pricing-head">
      <div>
        <div class="pricing-kicker">THRN pricing</div>
        <h2 class="pricing-title">Start free. <em>Go deeper.</em></h2>
        <p class="pricing-subtitle">Choose the level of marketing intelligence that fits where you are. Upgrade when you need more depth.</p>
      </div>
      <div class="currency-toggle" role="group" aria-label="Currency">
        <button type="button" data-currency="USD">USD</button>
        <button type="button" data-currency="INR">INR</button>
      </div>
    </div>
    <div class="pricing-grid">
      <article class="pricing-card">
        <div class="pricing-name">Free</div>
        <div class="pricing-description">Get clear marketing direction without the commitment.</div>
        <div class="pricing-price"><strong data-usd="0" data-inr="0">$0</strong><span>/ month</span></div>
        <ul class="pricing-features">
          <li>Core marketing consultation</li>
          <li>Basic strategic guidance</li>
          <li>Explore THRN modes</li>
        </ul>
        <div class="pricing-note">No credit card required.</div>
      </article>
      <article class="pricing-card featured">
        <div class="pricing-badge">Most Popular</div>
        <div class="pricing-name">Pro</div>
        <div class="pricing-description">For founders and marketers who want deeper strategic thinking.</div>
        <div class="pricing-price"><strong data-usd="5" data-inr="399">$5</strong><span>/ month</span></div>
        <ul class="pricing-features">
          <li>Everything in Free</li>
          <li>Full Consult, Audit and Plan modes</li>
          <li>Deeper strategic analysis</li>
          <li>Higher usage limits</li>
        </ul>
        <div class="pricing-note">Built for serious day-to-day marketing work.</div>
      </article>
      <article class="pricing-card">
        <div class="pricing-name">Business</div>
        <div class="pricing-description">For teams that need more room for ongoing marketing work.</div>
        <div class="pricing-price"><strong data-usd="15" data-inr="1199">$15</strong><span>/ month</span></div>
        <ul class="pricing-features">
          <li>Everything in Pro</li>
          <li>Highest usage limits</li>
          <li>Advanced marketing workflows</li>
          <li>Priority access</li>
        </ul>
        <div class="pricing-note">Designed for growing teams and businesses.</div>
      </article>
    </div>
  </div>
</section>
'''

              if '</style>' in html:
                  html = html.replace('</style>', styles + '\n</style>', 1)
              else:
                  html = html.replace('</head>', styles + '\n</head>', 1)

              marker = re.search(r'(<section[^>]+(?:id=["\']frameworks["\']|id=["\']contact["\'])[^>]*>)', html, re.I)
              if marker:
                  html = html[:marker.start()] + section + '\n' + html[marker.start():]
              else:
                  body_end = html.lower().rfind('</body>')
                  html = html[:body_end] + section + '\n' + html[body_end:]

              nav_pattern = re.compile(r'(<a[^>]+href=["\']#frameworks["\'][^>]*>)(Frameworks)(</a>)', re.I)
              if nav_pattern.search(html) and '#pricing' not in html.split('id="pricing"')[0]:
                  html = nav_pattern.sub(r'\1\2\3', html, count=1)
                  nav_match = nav_pattern.search(html)
                  if nav_match:
                      insert_at = nav_match.end()
                      pricing_link = '\n<a href="#pricing">Pricing</a>'
                      html = html[:insert_at] + pricing_link + html[insert_at:]

              currency_script = r'''
<script data-thrn-pricing>
(() => {
  const initPricing = () => {
    const buttons = [...document.querySelectorAll('[data-currency]')];
    const prices = [...document.querySelectorAll('[data-usd][data-inr]')];
    if (!buttons.length || !prices.length || window.__THRN_PRICING_BOOTED__) return;
    window.__THRN_PRICING_BOOTED__ = true;
    const apply = (currency) => {
      const selected = currency === 'INR' ? 'INR' : 'USD';
      prices.forEach((el) => { el.textContent = selected === 'INR' ? `₹${el.dataset.inr}` : `$${el.dataset.usd}`; });
      buttons.forEach((btn) => { const active = btn.dataset.currency === selected; btn.classList.toggle('active', active); btn.setAttribute('aria-pressed', String(active)); });
      try { localStorage.setItem('thrn_currency', selected); } catch (_) {}
    };
    let saved = null;
    try { saved = localStorage.getItem('thrn_currency'); } catch (_) {}
    const browserCurrency = (navigator.language || '').toLowerCase().startsWith('en-in') ? 'INR' : null;
    apply(saved === 'USD' || saved === 'INR' ? saved : (browserCurrency || 'USD'));
    buttons.forEach((btn) => btn.addEventListener('click', () => apply(btn.dataset.currency)));
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPricing); else initPricing();
})();
</script>
'''
              html = html.replace('</body>', currency_script + '\n</body>')
              path.write_text(html, encoding='utf-8')

      - name: Commit pricing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/thrn.html
          git diff --cached --quiet && exit 0
          git commit -m "Add THRN pricing with USD INR toggle"
          git push
