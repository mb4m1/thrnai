name: Restore THRN constellation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !startsWith(github.event.head_commit.message, 'THRN constellation:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore hero constellation animation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/content/thrn.html')
          text = path.read_text(encoding='utf-8')

          if 'id="thrn-net"' not in text:
              script = r'''\n<script nonce="__CSP_NONCE__">\n(() => {\n  const boot = () => {\n    if (window.__THRN_CONSTELLATION_BOOTED__) return;\n    window.__THRN_CONSTELLATION_BOOTED__ = true;\n    const hero = document.querySelector('.hero');\n    if (!hero || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n\n    const cv = document.createElement('canvas');\n    cv.id = 'thrn-net';\n    cv.setAttribute('aria-hidden', 'true');\n    hero.insertBefore(cv, hero.firstChild);\n    const ctx = cv.getContext('2d');\n    if (!ctx) return;\n\n    let w = 0, h = 0, dpr = 1, nodes = [], raf = 0, visible = true;\n    let ptrX = 0, ptrY = 0, tgtX = 0, tgtY = 0, strength = 0, tgtStrength = 0;\n    let lastMove = 0, hasPointer = false, lastT = 0;\n    const R = 170, R2 = R * R;\n    const isTouch = window.matchMedia('(hover: none)').matches || (navigator.maxTouchPoints || 0) > 0;\n    const ease = (k, dt) => 1 - Math.pow(1 - k, dt);\n\n    function resize() {\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      w = hero.clientWidth; h = hero.clientHeight;\n      cv.width = Math.max(1, w * dpr);\n      cv.height = Math.max(1, h * dpr);\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n      const cap = isTouch ? 40 : 64;\n      const count = Math.max(16, Math.min(cap, Math.round(w * h / (isTouch ? 22000 : 18000))));\n      nodes = Array.from({ length: count }, () => ({\n        x: Math.random() * w, y: Math.random() * h,\n        vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,\n        r: 0.8 + Math.random() * 1.1, p: Math.random() * Math.PI * 2,\n        ox: 0, oy: 0, a: Math.random() * Math.PI * 2, s: 0.4 + Math.random() * 0.6,\n        px: 0, py: 0, near: 0\n      }));\n    }\n\n    hero.addEventListener('pointermove', (ev) => {\n      if (ev.pointerType === 'touch') return;\n      const rect = hero.getBoundingClientRect();\n      tgtX = ev.clientX - rect.left;\n      tgtY = ev.clientY - rect.top;\n      hasPointer = true;\n      tgtStrength = 1;\n      lastMove = performance.now();\n    }, { passive: true });\n    hero.addEventListener('pointerleave', () => { tgtStrength = 0; }, { passive: true });\n\n    function frame(t) {\n      raf = requestAnimationFrame(frame);\n      if (!visible) { lastT = t; return; }\n      const dt = lastT ? Math.min(3, Math.max(0.2, (t - lastT) / 16.6667)) : 1;\n      lastT = t;\n      if (hasPointer && t - lastMove > 900) tgtStrength = 0;\n      strength += (tgtStrength - strength) * ease(0.03, dt);\n      ptrX += (tgtX - ptrX) * ease(0.08, dt);\n      ptrY += (tgtY - ptrY) * ease(0.08, dt);\n\n      const ambient = 1 - strength;\n      const ambAmp = isTouch ? 3 : 5;\n      const ambSpeed = isTouch ? 0.0028 : 0.004;\n      ctx.clearRect(0, 0, w, h);\n\n      for (const n of nodes) {\n        n.x += n.vx * dt; n.y += n.vy * dt;\n        if (n.x < 0 || n.x > w) n.vx *= -1;\n        if (n.y < 0 || n.y > h) n.vy *= -1;\n        let dox = 0, doy = 0;\n        n.near = 0;\n        if (strength > 0.01) {\n          const dx = ptrX - n.x, dy = ptrY - n.y;\n          const d2 = dx * dx + dy * dy;\n          if (d2 < R2) {\n            const f = 1 - Math.sqrt(d2) / R;\n            n.near = f * strength;\n            dox = dx * f * 0.16 * strength;\n            doy = dy * f * 0.16 * strength;\n          }\n        }\n        if (ambient > 0.01) {\n          n.a += ambSpeed * n.s * dt;\n          dox += Math.cos(n.a) * ambAmp * n.s * ambient;\n          doy += Math.sin(n.a * 1.3) * ambAmp * n.s * ambient;\n        }\n        n.ox += (dox - n.ox) * ease(0.045, dt);\n        n.oy += (doy - n.oy) * ease(0.045, dt);\n        n.px = n.x + n.ox; n.py = n.y + n.oy;\n      }\n\n      for (let i = 0; i < nodes.length; i++) {\n        for (let j = i + 1; j < nodes.length; j++) {\n          const a = nodes[i], b = nodes[j];\n          const dx = a.px - b.px, dy = a.py - b.py, d2 = dx * dx + dy * dy;\n          if (d2 < 26000) {\n            const boost = 1 + (a.near + b.near) * 0.9;\n            const alpha = Math.min(0.5, (1 - d2 / 26000) * 0.22 * boost);\n            ctx.strokeStyle = 'rgba(124,158,122,' + alpha.toFixed(3) + ')';\n            ctx.lineWidth = 0.6;\n            ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();\n          }\n        }\n      }\n\n      for (const n of nodes) {\n        const pulse = 0.5 + 0.5 * Math.sin(t / 1400 + n.p);\n        const alpha = Math.min(0.85, 0.22 + pulse * 0.34 + n.near * 0.3);\n        ctx.fillStyle = 'rgba(168,196,166,' + alpha.toFixed(3) + ')';\n        ctx.beginPath(); ctx.arc(n.px, n.py, n.r * (1 + n.near * 0.5), 0, Math.PI * 2); ctx.fill();\n      }\n    }\n\n    resize();\n    raf = requestAnimationFrame(frame);\n    window.addEventListener('resize', resize);\n    document.addEventListener('visibilitychange', () => { visible = !document.hidden; });\n    if ('IntersectionObserver' in window) {\n      new IntersectionObserver((e) => { visible = e[0].isIntersecting && !document.hidden; }).observe(hero);\n    }\n  };\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });\n  else boot();\n})();\n</script>\n'''
              text = text.replace('</body>', script + '</body>', 1)

              path.write_text(text, encoding='utf-8')
          else:
              print('Constellation already present; no changes needed.')

      - name: Commit constellation restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No constellation changes needed."
          else
            git add src/content/thrn.html .github/workflows/restore-thrn-constellation.yml
            git commit -m "THRN constellation: restore hero animation"
            git push
          fi
